<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta name="theme-color" content="#071a3d">

    <meta
        name="description"
        content="Rishi Music - Your personal offline music player"
    >

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >

    <title>Rishi Music</title>

    <!-- Stylesheet -->
    <link rel="stylesheet" href="./style.css">

    <!-- PWA Manifest -->
    <link rel="manifest" href="./manifest.json">

    <!-- Optional browser icon: uses a local file if available -->
    <link rel="icon" href="./icon-192.png" type="image/png">

</head>

<body>

    <div class="app-container">

        <!-- =====================================
             SIDEBAR / APP BRAND
        ====================================== -->

        <aside class="sidebar">

            <div class="brand">
                <h1>♫ RISHI MUSIC</h1>
                <p>Personal Audio Hub</p>
            </div>

            <!-- IMPORT MUSIC -->

            <label class="btn-import" for="audioFileInput">

                <span>＋ Import Track</span>

                <input
                    type="file"
                    id="audioFileInput"
                    accept="audio/*,.mp3,.m4a,.aac,.wav,.ogg,.opus,.flac,.3gp,.amr"
                    multiple
                    aria-label="Import music files"
                >

            </label>

            <!-- PLAYLIST / MUSIC DIRECTOR FILTER -->

            <div class="filter-group">

                <label for="directorFilter">
                    PLAYLIST / ARTIST
                </label>

                <select id="directorFilter">
                    <option value="all">All</option>
                </select>

            </div>

        </aside>


        <!-- =====================================
             MAIN MUSIC LIBRARY
        ====================================== -->

        <main class="main-content">

            <header class="top-nav">

                <h2 id="viewTitle">All Songs</h2>

                <input
                    type="search"
                    id="searchInput"
                    placeholder="🔍 Search song name..."
                    autocomplete="off"
                    aria-label="Search songs"
                >

            </header>

            <!-- SONG COUNT -->

            <div
                id="trackCountBadge"
                class="track-count"
                aria-live="polite"
            >
                0 songs
            </div>

            <!-- SONG LIST -->

            <section
                class="song-list"
                id="songListContainer"
                aria-label="Music library"
                aria-live="polite"
            >

                <div class="empty-library">
                    <p>♫</p>
                    <h3>Your music library is ready</h3>
                    <p>Tap Import Track to add your favourite songs.</p>
                </div>

            </section>

        </main>


        <!-- =====================================
             BOTTOM MUSIC PLAYER
        ====================================== -->

        <footer class="player-bar">

            <!-- CURRENT SONG INFORMATION -->

            <div class="meta-box">

                <div
                    class="track-title"
                    id="playerTitle"
                    aria-live="polite"
                >
                    No track playing
                </div>

                <div
                    class="track-artist"
                    id="playerArtist"
                >
                    Select a song from your library
                </div>

            </div>


            <!-- PLAYBACK CONTROLS -->

            <div class="controls-box">

                <button
                    type="button"
                    id="prevBtn"
                    class="control-btn"
                    aria-label="Previous song"
                    title="Previous song"
                >
                    ⏮
                </button>

                <button
                    type="button"
                    id="playBtn"
                    class="control-btn primary"
                    aria-label="Play or pause"
                    title="Play or pause"
                >
                    ▶
                </button>

                <button
                    type="button"
                    id="nextBtn"
                    class="control-btn"
                    aria-label="Next song"
                    title="Next song"
                >
                    ⏭
                </button>

            </div>


            <!-- SONG PROGRESS -->

            <div class="slider-box">

                <span id="currentTime">0:00</span>

                <input
                    type="range"
                    id="progressBar"
                    min="0"
                    max="100"
                    value="0"
                    step="0.1"
                    aria-label="Song progress"
                >

                <span id="totalTime">0:00</span>

            </div>

        </footer>

    </div>


    <!-- =====================================
         AUDIO ENGINE
    ====================================== -->

    <audio
        id="audioEngine"
        preload="auto"
        playsinline
    ></audio>


    <!-- =====================================
         SERVICE WORKER REGISTRATION
         Supports offline caching when sw.js
         is configured correctly.
    ====================================== -->

    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", function () {
                navigator.serviceWorker.register("./sw.js")
                    .catch(function (error) {
                        console.error(
                            "Service worker registration failed:",
                            error
                        );
                    });
            });
        }
    </script>


    <!-- =====================================
         APPLICATION SCRIPT
    ====================================== -->

    <script src="./app.js"></script>

</body>
</html>
